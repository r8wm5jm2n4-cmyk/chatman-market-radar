<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatman Market Radar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .card {
      background: #172033;
      padding: 20px;
      margin: 15px 0;
      border-radius: 14px;
    }

    .card h2 {
      margin: 0 0 15px 0;
      font-size: 22px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📡 Chatman Market Radar</h1>
    <div class="subtitle">
      スーパーボーイ専用・マーケット監視システム
    </div>

    <div class="card">
      <h2>🇯🇵 日経平均</h2>
      <div class="value" id="nikkei">取得中...</div>
    </div>

    <div class="card">
      <h2>🇺🇸 NASDAQ</h2>
      <div class="value">--</div>
    </div>

    <div class="card">
      <h2>💵 USD / JPY</h2>
      <div class="value">-- 円</div>
    </div>

    <div class="card">
      <h2>📊 売買代金</h2>
      <div class="value">-- 兆円</div>
    </div>

    <div class="card">
      <h2>💰 売買代金 ÷ 出来高</h2>
      <div class="value">-- 円 / 株</div>
    </div>

    <div class="status" id="status">
      日経平均データを取得しています...
    </div>

  </div>

  <script>
    async function updateNikkei() {
      const nikkeiElement = document.getElementById("nikkei");
      const statusElement = document.getElementById("status");

      try {
        const response = await fetch(
          "https://nikkei.feargreedchart.com/api/?action=nikkei"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        console.log(data);

        const level = Number(data?.nikkei?.level);

        if (!Number.isFinite(level)) {
          throw new Error("日経平均のデータ形式が不正です");
        }

        nikkeiElement.textContent =
          level.toLocaleString("ja-JP", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }) + " 円";

        statusElement.textContent = "日経平均 更新完了";
      } catch (error) {
        console.error(error);
        nikkeiElement.textContent = "取得できません";
        statusElement.textContent =
          "日経平均データの取得に失敗しました";
      }
    }

    updateNikkei();
  </script>

</body>
</html>
